<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swarm Node Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 2;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    .ascii-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: yellow;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-align: center;
      z-index: 10;
      white-space: pre;
      animation: roachPulse 1.5s ease-in-out forwards;
    }
    @keyframes roachPulse {
      0% { opacity: 0; transform: scale(0.95); }
      25% { opacity: 1; transform: scale(1.05); }
      50% { opacity: 1; transform: scale(1); }
      75% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const terminal = document.getElementById("terminal");function printLine(text = "", delay = 35) {
  return new Promise((resolve) => {
    const line = document.createElement("div");
    terminal.appendChild(line);
    let i = 0;
    const interval = setInterval(() => {
      line.textContent += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        resolve();
      }
    }, delay);
  });
}

function showRoachFlash() {
  const flash = document.createElement('div');
  flash.className = 'ascii-flash';
  flash.innerText = `           ,  .'''''.  ...    ''''',  .'
        ','     ,.MMMM;.;'      '.
         ;;    ;MMMMMMMMM;     ;;'
        :'M:  ;MMMMMMMMMMM;.  :M':
        : M:  MMMMMMMMMMMMM:  :M  .
       .' M:  MMMMMMMMMMMMM:  :M. ;
       ; :M'  :MMMMMMMMMMMM'  'M: :
       : :M: .;"MMMMMMMMM":;. ,M: :
       :  ::,MMM;.M":::M.;MMM ::' :
     ,.;    ;MMMMMM;:MMMMMMMM:    :,.
     MMM.;.,MMMMMMMM;MMMMMMMM;.,;.MMM
     M:''':MMMMMMMMM;MMMMMMMM: "': M
     M.:   ;MMMMMMMMMMMMMMMMMM;   : M
     :::   MMMMMMMMMMM;MMMMMMMM   ::M
    ,'';   MMMMMMMMMMMM:MMMMMMM   :'".`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1500);
}

function resetToFilePhase() {
  terminal.innerHTML = '';
  runFilePhase();
}

async function runFilePhase() {
  await printLine("█ D-BUG HERE.");
  await printLine("█ One of these files hides my payload.");
  await printLine("█ Use:     CAT [filename]     to examine files");
  await printLine("█ Then:    EXTRACT [filename] to recover the target");
  await printLine("█ You only get one shot. No do-overs.\n");
  await printLine("/NODE/SWARM-RUNNER_12X/");
  const files = [
    "corememo.log",
    "debugdump.txt",
    "bugscan_322.tmp",
    "system_flags.ini",
    "trashnote_01.txt",
    "malware_march.mp3"
  ];
  for (let f of files) {
    await printLine("- " + f);
  }
  await printLine("\n> Type your command:");
  const input = document.createElement("input");
  terminal.appendChild(input);
  input.focus();
  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const cmd = input.value.trim();
      input.disabled = true;
      if (cmd.startsWith("cat ")) {
        const target = cmd.split(" ")[1];
        if (target === "corememo.log") {
          await printLine("...NODE INDEX REPORT...");
          await printLine("> SYS_PURGE FLAGGED");
          await printLine("> PAYLOAD CACHE LOCATED");
          await printLine("> ref: ./temp/redlist/_vault.key");
          await printLine(">> TRACE END <<");
        } else {
          await printLine("> No data found.");
        }
      } else if (cmd.startsWith("extract ")) {
        const file = cmd.split(" ")[1];
        if (file === "_vault.key") {
          showRoachFlash();
          await printLine("\n> EXTRACTING...");
          await printLine("> PAYLOAD CONFIRMED.");
          await printLine("> MISSION COMPLETE.");
        } else {
          await printLine("> ACCESS DENIED. TRACE DETECTED. SYSTEM RESTORING...\n");
          setTimeout(resetToFilePhase, 1500);
        }
      } else {
        await printLine("> UNKNOWN COMMAND.");
      }
      input.disabled = false;
      input.value = "";
      input.focus();
    }
  });
}

runFilePhase();

  </script>
</body>
</html>
