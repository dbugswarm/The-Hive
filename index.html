<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Node Terminal</title>
  <style>
    @font-face {
      font-family: 'MSDOS';
      src: local('Courier New'), monospace;
    }
    body {
      background-color: black;
      color: #FFFF00; /* Yellow text */
      font-family: 'MSDOS', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 1;
    }
    .blinking {
      animation: blink 1s step-start 0s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'MSDOS', monospace;
      font-size: 16px;
      width: 300px;
    }
    /* Enhanced CRT Scanlines + Glow */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 0, 0.07),
        rgba(255, 255, 0, 0.07) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }body::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.75);
  pointer-events: none;
}

  </style>
</head>
<body>
  <audio id="beep-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
  <div id="terminal"></div>
  <script>
    const terminal = document.getElementById("terminal");
    const beep = document.getElementById("beep-sound");
    let state = "boot";const printLine = (text = "", delay = 50) => {
  return new Promise((resolve) => {
    const line = document.createElement("div");
    terminal.appendChild(line);
    let i = 0;
    const interval = setInterval(() => {
      line.textContent += text[i];
      if (text[i] && text[i] !== " ") beep.cloneNode().play();
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        resolve();
      }
    }, delay);
  });
};

const printLines = async (lines) => {
  for (const line of lines) {
    await printLine(line);
    await new Promise((r) => setTimeout(r, 300));
  }
};

const bootSequence = async () => {
  await printLines([
    "> INITIATING CONNECTION...",
    "> ACCESSING LOCAL NODE: SWARM-RUNNER_12X",
    "> RUNNING DECRYPT ROUTINE...",
    "> ICE TRIPWIRE ENGAGED.",
    "> CIPHER MODULE ONLINE.\n",
    "> CIPHER CHALLENGE: EXJEUDLQ",
    "> (USE CLUE FROM NFC DEVICE TO DECRYPT)\n",
    "> INPUT DECRYPTED STRING:"
  ]);

  const input = document.createElement("input");
  input.setAttribute("autocomplete", "off");
  input.focus();
  terminal.appendChild(input);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      handleInput(input.value.trim().toUpperCase());
    }
  });
};

const handleInput = (value) => {
  const correctAnswer = "BUGBRAIN";
  const passcode = "SW4RM-B1T3-V4";
  terminal.innerHTML += `\n> ${value}`;

  if (value === correctAnswer) {
    terminal.innerHTML += `\n> ACCESS PHRASE ACCEPTED.`;
    terminal.innerHTML += `\n> UNLOCKING NODE...`;
    terminal.innerHTML += `\n> PASSCODE: ${passcode}\n`;
    terminal.innerHTML += `\n> "I'm impressed. We could use a hacker like you in our ranks.`;
    terminal.innerHTML += `\n> Seek me out for a reward.`;
    terminal.innerHTML += `\n> I'm D-Bug with the R@t BOIZ."`;
    terminal.innerHTML += `\n> \n> Bring this password to D-Bug to complete your mission.`;
  } else {
    terminal.innerHTML += `\n> ERROR: INVALID STRING.`;
    terminal.innerHTML += `\n> INTRUSION COUNTERMEASURE ACTIVATED.`;
    terminal.innerHTML += `\n> RESETTING TERMINAL...`;
    setTimeout(() => {
      location.reload();
    }, 3000);
  }
};

bootSequence();

  </script>
</body>
</html>
