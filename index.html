<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swarm Node Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 2;
    }
    #logo {
      font-weight: bold;
      color: #FFFF00;
      text-align: center;
      margin-bottom: 20px;
    }
    #noise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,0,0.03) 0.5px,
        transparent 1px
      );
      animation: staticNoise 0.2s steps(2, end) infinite;
    }
    @keyframes staticNoise {
      0% { opacity: 0.1; transform: translate(0, 0); }
      50% { opacity: 0.2; transform: translate(-1px, 1px); }
      100% { opacity: 0.1; transform: translate(1px, -1px); }
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 0, 0.2),
        rgba(255, 255, 0, 0.2) 2px,
        transparent 2px,
        transparent 4px
      );
      animation: flicker 1.5s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    .glitch {
      animation: glitch 0.3s steps(2, end) 3;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -1px); }
      60% { transform: translate(-2px, 3px); }
      80% { transform: translate(1px, -2px); }
      100% { transform: translate(0); }
    }
    .flash-yellow {
      animation: flashYellow 0.3s 2;
    }
    @keyframes flashYellow {
      0%, 100% { background-color: black; }
      50% { background-color: #ffff00; }
    }
    .flash-red {
      animation: flashRed 0.3s 2;
    }
    @keyframes flashRed {
      0%, 100% { background-color: black; }
      50% { background-color: #ff0000; }
    }
    .ascii-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: yellow;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-align: center;
      z-index: 10;
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>
  <div id="noise"></div>
  <div id="terminal">
    <div id="logo">[ D-BUG // NODE_12X ]</div>
  </div>
  <script>
    const terminal = document.getElementById("terminal");
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    const beep = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YRAAAAAA//8AAP//AAD//wAA//8AAP//AAD//wAA");

    function Particle(x, y, dx, dy, color) {
      this.x = x;
      this.y = y;
      this.dx = dx;
      this.dy = dy;
      this.color = color;
      this.alpha = 1;

      this.update = function () {
        this.x += this.dx;
        this.y += this.dy;
        this.alpha -= 0.02;
      };

      this.draw = function () {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 2, 2);
        ctx.globalAlpha = 1;
      };
    }

    function createExplosion(x, y) {
      const colors = ["#ffff00", "#ff6600", "#00ffcc"];
      for (let i = 0; i < 30; i++) {
        const dx = (Math.random() - 0.5) * 4;
        const dy = (Math.random() - 0.5) * 4;
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(x, y, dx, dy, color));
      }
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      });
      requestAnimationFrame(animateFireworks);
    }

    function launchFireworks() {
      for (let i = 0; i < 5; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.5;
        createExplosion(x, y);
      }
    }

    const printLine = (text = "", delay = 50) => {
      return new Promise((resolve) => {
        const line = document.createElement("div");
        terminal.appendChild(line);
        let i = 0;
        const interval = setInterval(() => {
          line.textContent += text[i];
          if (text[i] && text[i] !== " ") beep.play().catch(() => {});
          i++;
          if (i >= text.length) {
            clearInterval(interval);
            resolve();
          }
        }, delay);
      });
    };

    const showRoachFlash = () => {
      const flash = document.createElement('div');
      flash.className = 'ascii-flash';
      flash.innerText = `           ,  .'''''.  ...    ''''',  .'
            ','     ,.MMMM;.;'      '.
             ;;    ;MMMMMMMMM;     ;;'
            :'M:  ;MMMMMMMMMMM;.  :M':
            : M:  MMMMMMMMMMMMM:  :M  .
           .' M:  MMMMMMMMMMMMM:  :M. ;
           ; :M'  :MMMMMMMMMMMM'  'M: :
           : :M: .;"MMMMMMMMM":;. ,M: :
           :  ::,MMM;.M":::M.;MMM ::' :
         ,.;    ;MMMMMM;:MMMMMMMM:    :,.
         MMM.;.,MMMMMMMM;MMMMMMMM;.,;.MMM
         M:''':MMMMMMMMM;MMMMMMMM: "': M
         M.:   ;MMMMMMMMMMMMMMMMMM;   : M
         :::   MMMMMMMMMMM;MMMMMMMM   ::M
        ,'';   MMMMMMMMMMMM:MMMMMMM   :'".
      ,'   :   MMMMMMMMMMMM:MMMMMMM   :   '.
     '     :  'MMMMMMMMMMMMM:MMMMMM   ;     '
     ,.....;.. MMMMMMMMMMMMM:MMMMMM ..:....;.
     :MMMMMMMM MMMMMMMMMMMMM:MMMMMM MMMMMMMM:
     :MM""":"" MMMMMMMMMMMMM:MMMMMM "": "'MM:
      MM:   :  MMMMMMMMMMMMM:MMMMMM  ,'  :MM
      'MM   :  :MMMMMMMMMMMM:MMMMM:  :   ;M:
       :M;  :  'MMMMMMMMMMMMMMMMMM'  :  ;MM
       :MM. :   :MMMMMMMMMM;MMMMM:   :  MM:
        :M: :    MMMMMMMMM'MMMMMM'   : :MM'
        'MM :    "MMMMMMM:;MMMMM"   ,' ;M"
         'M  :    """"":;;;"""""    :  M:
         ;'  :     "MMMMMMMM;."     :  "".
       ,;    :      :MMMMMMM:;.     :    '.
      :'     :    ,MM''""""'':M:    :     ';
     ;'      :    ;M'         MM.   :       ;.
   ,'        :    "            "'   :        '.
   '        :'                       '        ''
 .          :                        '          '
'          ;                          ;          '`;
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1500);
    };

    const bootSequence = async () => {
      await printLine("> INITIATING CONNECTION...");
      await printLine("> ACCESSING LOCAL NODE: SWARM-RUNNER_12X");
      await printLine("> RUNNING DECRYPT ROUTINE...");
      await printLine("> ICE TRIPWIRE ENGAGED.");
      await printLine("> CIPHER MODULE ONLINE.\n");
      await printLine("> CIPHER CHALLENGE: EXJEUDLQ");
      await printLine("> (USE CLUE FROM NFC DEVICE TO DECRYPT)\n");
      await printLine("> INPUT DECRYPTED STRING:");

      const input = document.createElement("input");
      input.setAttribute("autocomplete", "off");
      input.setAttribute("placeholder", "█");
      input.focus();
      terminal.appendChild(input);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          handleInput(input.value.trim().toUpperCase());
        }
      });
    };

    const handleInput = async (value) => {
      terminal.innerHTML += `\n> ${value}`;
      if (value === "BUGBRAIN") {
        document.body.classList.add("flash-yellow");
        showRoachFlash();
        setInterval(() => launchFireworks(), 1000);
        await printLine("> ACCESS PHRASE ACCEPTED.");
        await printLine("> UNLOCKING NODE...");
        await printLine("> I'm impressed. We could use a hacker like you in our ranks.\n");
        await printLine("> PASSWORD: SW4RM-B1T3-V4\n");
        await printLine("> Seek me out for a reward.");
        await printLine("> I'm D-Bug with the R@t BOIZ.\n");
        await printLine("> Bring this password to D-Bug to complete your mission.");
        document.body.classList.remove("flash-yellow");
        animateFireworks();
      } else {
        terminal.classList.add("glitch");
        document.body.classList.add("flash-red");
        await printLine("> ERROR: INVALID STRING.");
        await printLine("> INTRUSION COUNTERMEASURE ACTIVATED.");
        await printLine("> RESETTING TERMINAL...");
        setTimeout(() => location.reload(), 2000);
      }
    };

    bootSequence();
  </script>
</body>
</html>
