<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Node Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 1;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    input::placeholder {
      color: #FFFF00;
    }
    .glitch {
      animation: glitch 0.3s steps(2, end) 3;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -1px); }
      60% { transform: translate(-2px, 3px); }
      80% { transform: translate(1px, -2px); }
      100% { transform: translate(0); }
    }
    .flash-yellow {
      animation: flashYellow 0.3s 2;
    }
    @keyframes flashYellow {
      0%, 100% { background-color: black; }
      50% { background-color: #ffff00; }
    }
    .flash-red {
      animation: flashRed 0.3s 2;
    }
    @keyframes flashRed {
      0%, 100% { background-color: black; }
      50% { background-color: #ff0000; }
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 0, 0.2),
        rgba(255, 255, 0, 0.2) 4px,
        transparent 4px,
        transparent 8px
      );
      animation: flicker 1.5s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <audio id="beep-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YRAAAAAA//8AAP//AAD//wAA//8AAP//AAD//wAA" type="audio/wav">
  </audio>
  <audio id="focus-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRlAAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YRgAAAAA//8AAP//AAD//wAA//8AAP//AAD//wAA" type="audio/wav">
  </audio>
  <div id="terminal"></div>
  <script>
    const terminal = document.getElementById("terminal");
    const beep = document.getElementById("beep-sound");
    const focusSound = document.getElementById("focus-sound");const playBeep = () => {
  const sound = beep.cloneNode();
  sound.play().catch(() => {});
};

const playFocusSound = () => {
  const fx = focusSound.cloneNode();
  fx.play().catch(() => {});
};

const printLine = (text = "", delay = 50) => {
  return new Promise((resolve) => {
    const line = document.createElement("div");
    terminal.appendChild(line);
    let i = 0;
    const interval = setInterval(() => {
      line.textContent += text[i];
      if (text[i] && text[i] !== " ") playBeep();
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        resolve();
      }
    }, delay);
  });
};

const bootSequence = async () => {
  await printLine("> INITIATING CONNECTION...");
  await printLine("> ACCESSING LOCAL NODE: SWARM-RUNNER_12X");
  await printLine("> RUNNING DECRYPT ROUTINE...");
  await printLine("> ICE TRIPWIRE ENGAGED.");
  await printLine("> CIPHER MODULE ONLINE.\n");
  await printLine("> CIPHER CHALLENGE: EXJEUDLQ");
  await printLine("> (USE CLUE FROM NFC DEVICE TO DECRYPT)\n");
  await printLine("> INPUT DECRYPTED STRING:");

  const input = document.createElement("input");
  input.setAttribute("autocomplete", "off");
  input.setAttribute("placeholder", "█");
  input.addEventListener("focus", playFocusSound);
  input.focus();
  terminal.appendChild(input);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      handleInput(input.value.trim().toUpperCase());
    }
  });
};

const handleInput = async (value) => {
  terminal.innerHTML += `\n> ${value}`;
  if (value === "BUGBRAIN") {
    document.body.classList.add("flash-yellow");
    await printLine("> ACCESS PHRASE ACCEPTED.");
    await printLine("> UNLOCKING NODE...");
    await printLine("> PASSCODE: SW4RM-B1T3-V4\n");
    await printLine("> \"I'm impressed. We could use a hacker like you in our ranks.");
    await printLine("> Seek me out for a reward.");
    await printLine("> I'm D-Bug with the R@t BOIZ.\"\n");
    await printLine("> Bring this password to D-Bug to complete your mission.");
    document.body.classList.remove("flash-yellow");
  } else {
    terminal.classList.add("glitch");
    document.body.classList.add("flash-red");
    await printLine("> ERROR: INVALID STRING.");
    await printLine("> INTRUSION COUNTERMEASURE ACTIVATED.");
    await printLine("> RESETTING TERMINAL...");
    setTimeout(() => location.reload(), 2000);
  }
};

bootSequence();

  </script>
</body>
</html>
