<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swarm Node Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 2;
    }
    #logo {
      font-weight: bold;
      color: #FFFF00;
      text-align: center;
      margin-bottom: 20px;
    }
    #noise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,0,0.03) 0.5px, transparent 1px);
      animation: staticNoise 0.2s steps(2, end) infinite;
    }
    @keyframes staticNoise {
      0% { opacity: 0.1; transform: translate(0, 0); }
      50% { opacity: 0.2; transform: translate(-1px, 1px); }
      100% { opacity: 0.1; transform: translate(1px, -1px); }
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 0, 0.2), rgba(255, 255, 0, 0.2) 2px, transparent 2px, transparent 4px);
      animation: flicker 1.5s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    .ascii-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: yellow;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-align: center;
      z-index: 10;
      white-space: pre;
      animation: roachPulse 1.5s ease-in-out forwards;
    }
    @keyframes roachPulse {
      0% { opacity: 0; transform: scale(0.95); }
      25% { opacity: 1; transform: scale(1.05); }
      50% { opacity: 1; transform: scale(1); }
      75% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>
  <div id="noise"></div>
  <div id="terminal">
    <div id="logo">[ D-BUG // NODE_12X ]</div>
  </div>
  <script>
    const terminal = document.getElementById("terminal");
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];

    const printLine = (text = "", delay = 35) => {
      return new Promise((resolve) => {
        const line = document.createElement("div");
        terminal.appendChild(line);
        let i = 0;
        const interval = setInterval(() => {
          line.textContent += text[i];
          i++;
          if (i >= text.length) {
            clearInterval(interval);
            resolve();
          }
        }, delay);
      });
    };

    const showRoachFlash = () => {
      const flash = document.createElement('div');
      flash.className = 'ascii-flash';
      flash.innerText = `           ,  .'''''.  ...    ''''',  .'\n            ','     ,.MMMM;.;'      '.\n             ;;    ;MMMMMMMMM;     ;;'\n            :'M:  ;MMMMMMMMMMM;.  :M':\n            : M:  MMMMMMMMMMMMM:  :M  .\n           .' M:  MMMMMMMMMMMMM:  :M. ;\n           ; :M'  :MMMMMMMMMMMM'  'M: :\n           : :M: .;\"MMMMMMMMM\":;. ,M: :\n           :  ::,MMM;.M\":::M.;MMM ::' :\n         ,.;    ;MMMMMM;:MMMMMMMM:    :,.\n         MMM.;.,MMMMMMMM;MMMMMMMM;.,;.MMM\n         M:''':MMMMMMMMM;MMMMMMMM: \"': M\n         M.:   ;MMMMMMMMMMMMMMMMMM;   : M\n         :::   MMMMMMMMMMM;MMMMMMMM   ::M\n        ,'';   MMMMMMMMMMMM:MMMMMMM   :'\".\n      ,'   :   MMMMMMMMMMMM:MMMMMMM   :   '.\n     '     :  'MMMMMMMMMMMMM:MMMMMM   ;     '\n     ,.....;.. MMMMMMMMMMMMM:MMMMMM ..:....;.\n     :MMMMMMMM MMMMMMMMMMMMM:MMMMMM MMMMMMMM:\n     :MM\"\"\":\"\" MMMMMMMMMMMMM:MMMMMM \"\": \"'MM:\n      MM:   :  MMMMMMMMMMMMM:MMMMMM  ,'  :MM\n      'MM   :  :MMMMMMMMMMMM:MMMMM:  :   ;M:\n       :M;  :  'MMMMMMMMMMMMMMMMMM'  :  ;MM\n       :MM. :   :MMMMMMMMMM;MMMMM:   :  MM:\n        :M: :    MMMMMMMMM'MMMMMM'   : :MM'\n        'MM :    \"MMMMMMM:;MMMMM\"   ,' ;M\"\n         'M  :    \"\"\"\":;;;\"\"\"\"\"    :  M:\n         ;'  :     \"MMMMMMMM;.\"     :  \"\".\n       ,;    :      :MMMMMMM:;.     :    '.\n      :'     :    ,MM''\"\"\"\"'':M:    :     ';`;
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1500);
    };

    function createExplosion(x, y) {
      const colors = ["#ffff00", "#ff6600", "#00ffcc"];
      for (let i = 0; i < 30; i++) {
        const dx = (Math.random() - 0.5) * 4;
        const dy = (Math.random() - 0.5) * 4;
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push({ x, y, dx, dy, alpha: 1, color });
      }
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 0.02;
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
        if (p.alpha <= 0) particles.splice(i, 1);
      });
      requestAnimationFrame(animateFireworks);
    }

    function launchFireworks() {
      for (let i = 0; i < 5; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height * 0.5;
        createExplosion(x, y);
      }
    }

    async function bootSequence() {
      await printLine("> PASSWORD ACCEPTED.");
      await printLine("> SYSTEM TRACE REDIRECTED...");
      await printLine(">>>>> OVERRIDE INJECTED <<<<<");
      await printLine("█ D-BUG HERE.");
      await printLine("█ One of these junk files holds my payload.");
      await printLine("█ Only one.");
      await printLine("█ Find it. Extract it. Deliver it.");
      await printLine("█ END TRACE.\n");

      const files = [
        "trashnote_01.txt",
        "temp_bite.exe",
        "corememo.log",
        "debugdump.txt",
        "malware_march.mp3",
        "vault.key"
      ];

      for (let f of files) {
        await printLine("> " + f);
      }

      await printLine("\n> You may CAT any .txt or .log file.");

      const input = document.createElement("input");
      terminal.appendChild(input);
      input.focus();

      input.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          const cmd = input.value.trim();
          input.disabled = true;

          if (cmd.startsWith("cat ")) {
            const target = cmd.split(" ")[1];
            if (target === "corememo.log") {
              await printLine("> Reading corememo.log...\n");
              await printLine("...NODE INDEX REPORT...");
              await printLine("> ARCHIVE PATH FOUND:");
              await printLine(":: temp/malcode/redlist");
              await printLine("> PAYLOAD REF:");
              await printLine(":: *** [vault.key]");
              await printLine("...end trace");
            } else {
              await printLine("> No data found.");
            }
          } else if (cmd.startsWith("extract ")) {
            const file = cmd.split(" ")[1];
            if (file === "vault.key") {
              showRoachFlash();
              setInterval(() => launchFireworks(), 1000);
              await printLine("\n> PAYLOAD EXTRACTED.");
              await printLine("> WELL DONE.");
              await printLine("> D-BUG OUT.");
              animateFireworks();
            } else {
              await printLine("> FILE INVALID. TRY AGAIN.");
            }
          } else {
            await printLine("> UNKNOWN COMMAND.");
          }

          input.disabled = false;
          input.value = "";
          input.focus();
        }
      });
    }

    bootSequence();
  </script>
</body>
</html>
