<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swarm Node Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 2;
    }
    #logo {
      font-weight: bold;
      color: #FFFF00;
      text-align: center;
      margin-bottom: 20px;
    }
    #noise {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,0,0.03) 0.5px,
        transparent 1px
      );
      animation: staticNoise 0.2s steps(2, end) infinite;
    }
    @keyframes staticNoise {
      0% { opacity: 0.1; transform: translate(0, 0); }
      50% { opacity: 0.2; transform: translate(-1px, 1px); }
      100% { opacity: 0.1; transform: translate(1px, -1px); }
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 0, 0.2),
        rgba(255, 255, 0, 0.2) 2px,
        transparent 2px,
        transparent 4px
      );
      animation: flicker 1.5s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    .glitch {
      animation: glitch 0.3s steps(2, end) 3;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -1px); }
      60% { transform: translate(-2px, 3px); }
      80% { transform: translate(1px, -2px); }
      100% { transform: translate(0); }
    }
    .flash-yellow {
      animation: flashYellow 0.3s 2;
    }
    @keyframes flashYellow {
      0%, 100% { background-color: black; }
      50% { background-color: #ffff00; }
    }
    .flash-red {
      animation: flashRed 0.3s 2;
    }
    @keyframes flashRed {
      0%, 100% { background-color: black; }
      50% { background-color: #ff0000; }
    }
    .ascii-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: yellow;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-align: center;
      z-index: 10;
      white-space: pre;
      animation: roachPulse 1.5s ease-in-out;
    }
    @keyframes roachPulse {
      0% { opacity: 0; transform: scale(0.9); }
      30% { opacity: 1; transform: scale(1.05); }
      60% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
