<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Node Terminal</title>
  <style>
    @font-face {
      font-family: 'MSDOS';
      src: local('Courier New'), monospace;
    }
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'MSDOS', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 1;
    }
    .blinking {
      animation: blink 1s step-start 0s infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'MSDOS', monospace;
      font-size: 16px;
      width: 300px;
    }
    .glitch {
      animation: glitch 0.3s steps(2, end) 3;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -1px); }
      60% { transform: translate(-2px, 3px); }
      80% { transform: translate(1px, -2px); }
      100% { transform: translate(0); }
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 0, 0.2),
        rgba(255, 255, 0, 0.2) 4px,
        transparent 4px,
        transparent 8px
      );
      animation: flicker 1.5s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <audio id="beep-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YRAAAAAA//8AAP//AAD//wAA//8AAP//AAD//wAA" type="audio/wav">
  </audio>
  <div id="terminal"></div>
  <script>
    const terminal = document.getElementById("terminal");
    const beep = document.getElementById("beep-sound");
    let state = "boot";const playBeep = () => {
  const sound = beep.cloneNode();
  sound.play().catch(() => {});
};

const printLine = (text = "", delay = 50) => {
  return new Promise((resolve) => {
    const line = document.createElement("div");
    terminal.appendChild(line);
    let i = 0;
    const interval = setInterval(() => {
      line.textContent += text[i];
      if (text[i] && text[i] !== " ") playBeep();
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        resolve();
      }
    }, delay);
  });
};

const printLines = async (lines) => {
  for (const line of lines) {
    await printLine(line);
    await new Promise((r) => setTimeout(r, 300));
  }
};

const bootSequence = async () => {
  await printLines([
    "> INITIATING CONNECTION...",
    "> ACCESSING LOCAL NODE: SWARM-RUNNER_12X",
    "> RUNNING DECRYPT ROUTINE...",
    "> ICE TRIPWIRE ENGAGED.",
    "> CIPHER MODULE ONLINE.\n",
    "> CIPHER CHALLENGE: EXJEUDLQ",
    "> (USE CLUE FROM NFC DEVICE TO DECRYPT)\n",
    "> INPUT DECRYPTED STRING:"
  ]);

  const input = document.createElement("input");
  input.setAttribute("autocomplete", "off");
  input.focus();
  terminal.appendChild(input);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      handleInput(input.value.trim().toUpperCase());
    }
  });
};

const handleInput = async (value) => {
  const correctAnswer = "BUGBRAIN";
  const passcode = "SW4RM-B1T3-V4";
  terminal.innerHTML += `\n> ${value}`;

  if (value === correctAnswer) {
    await printLines([
      "> ACCESS PHRASE ACCEPTED.",
      "> UNLOCKING NODE...",
      `> PASSCODE: ${passcode}\n`,
      `> "I'm impressed. We could use a hacker like you in our ranks.`,
      `> Seek me out for a reward.`,
      `> I'm D-Bug with the R@t BOIZ."`,
      `> \n> Bring this password to D-Bug to complete your mission.`
    ]);
  } else {
    terminal.classList.add("glitch");
    terminal.innerHTML += `\n> ERROR: INVALID STRING.`;
    terminal.innerHTML += `\n> INTRUSION COUNTERMEASURE ACTIVATED.`;
    terminal.innerHTML += `\n> RESETTING TERMINAL...`;
    await new Promise((r) => setTimeout(r, 500));
    await printLines([
      "\n\n\n\n",
      "> SYSTEM CORE REBOOTING...",
      "> PURGING MEMORY CACHE...",
      "> RESTORING DEFAULT PROMPT...\n"
    ]);
    terminal.classList.remove("glitch");
    await new Promise((r) => setTimeout(r, 1000));
    location.reload();
  }
};

bootSequence();

  </script>
</body>
</html>
