<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D-Bug Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 2;
    }
    #logo {
      font-weight: bold;
      color: #FFFF00;
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    .ascii-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: yellow;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-align: center;
      z-index: 10;
      white-space: pre;
      animation: roachPulse 1.5s ease-in-out forwards;
    }
    @keyframes roachPulse {
      0% { opacity: 0; transform: scale(0.95); }
      25% { opacity: 1; transform: scale(1.05); }
      50% { opacity: 1; transform: scale(1); }
      75% { opacity: 1; transform: scale(1.05); }
