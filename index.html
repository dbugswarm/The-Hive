<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D-Bug Terminal</title>
  <style>
    body {
      background-color: black;
      color: #FFFF00;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 20px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }
    #terminal {
      white-space: pre-wrap;
      overflow-y: auto;
      height: 100vh;
      position: relative;
      z-index: 2;
    }
    #logo {
      font-weight: bold;
      color: #FFFF00;
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      background: black;
      color: #FFFF00;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      width: 300px;
      outline: none;
      caret-color: #FFFF00;
    }
    .ascii-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: yellow;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      text-align: center;
      z-index: 10;
      white-space: pre;
      animation: roachPulse 1.5s ease-in-out forwards;
    }
    @keyframes roachPulse {
      0% { opacity: 0; transform: scale(0.95); }
      25% { opacity: 1; transform: scale(1.05); }
      50% { opacity: 1; transform: scale(1); }
      75% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(0.95); }
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 0, 0.2), rgba(255, 255, 0, 0.2) 2px, transparent 2px, transparent 4px);
      animation: flicker 1.5s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
<canvas id="fireworks"></canvas>
<div id="terminal"><div id="logo">[ D-BUG // NODE_12X ]</div></div>

<script>
const terminal = document.getElementById("terminal");
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let inputField;
let particles = [];

function printLine(text = "", delay = 35) {
  return new Promise((resolve) => {
    const line = document.createElement("div");
    terminal.appendChild(line);
    let i = 0;
    const interval = setInterval(() => {
      line.textContent += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(interval);
        resolve();
      }
    }, delay);
  });
}

function showRoachFlash() {
  const flash = document.createElement('div');
  flash.className = 'ascii-flash';
  flash.innerText = `             ,--.     .--.
            /    \\. ./    \\
           /  /\\ / " \\ /\\  \\
          / _/  {~~v~~}  \\_ \\
         /     {   |   }     \\
        ;   /\\{    |    }/\\   \\
        | _/  {    |    }  \\_  :
        |     {    |    }      |
        |    /{    |    }\\     |
        |   / {    |    } \\    |
        |  /  {    |    }  \\   |
        |  \\  \\    |    /  /   |
        |   \\  \\   |   /  /    |
        \\    \\  \\  |  /  /     /
         \\   /   ~~~~~   \\    /`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1500);
}

function createExplosion(x, y) {
  const colors = ["#ffff00", "#ff6600", "#00ffcc"];
  for (let i = 0; i < 30; i++) {
    const dx = (Math.random() - 0.5) * 4;
    const dy = (Math.random() - 0.5) * 4;
    const color = colors[Math.floor(Math.random() * colors.length)];
    particles.push({ x, y, dx, dy, alpha: 1, color });
  }
}

function animateFireworks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach((p, i) => {
    p.x += p.dx;
    p.y += p.dy;
    p.alpha -= 0.02;
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 2, 2);
    if (p.alpha <= 0) particles.splice(i, 1);
  });
  requestAnimationFrame(animateFireworks);
}

function launchFireworks() {
  for (let i = 0; i < 5; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height * 0.5;
    createExplosion(x, y);
  }
}

function resetToFilePhase() {
  terminal.innerHTML = '<div id="logo">[ D-BUG // NODE_12X ]</div>';
  runFilePhase();
}

async function runCipherPhase() {
  await printLine("> Initializing uplink...");
  await printLine("> Connection established.");
  await printLine("> Handshake received from NODE_12X.");
  await printLine("> Launching secure prompt...");
  await printLine("> Decryption required to access node.");
  await printLine("> Cipher key embedded in your NFC chip.");
  await printLine("> Enter the decoded password to proceed:\n");

  const input = document.createElement("input");
  terminal.appendChild(input);
  input.focus();

  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const cmd = input.value.trim().toUpperCase();
      input.disabled = true;
      if (cmd === "BUGBRAIN") {
        await printLine("> PASSWORD ACCEPTED.\n");
        runFilePhase();
      } else {
        await printLine("> ACCESS DENIED.");
        input.disabled = false;
        input.value = "";
        input.focus();
      }
    }
  });
}

async function runFilePhase() {
  await printLine("█ D-BUG HERE.");
  await printLine("█ One of these files hides my payload.");
  await printLine("█ Use:     CAT [filename]     to examine files");
  await printLine("█ Then:    EXTRACT [filename] to recover the target");
  await printLine("█ You only get one shot. No do-overs.\n");
  await printLine("/NODE/SWARM-RUNNER_12X/");

  const files = [
    "bugscan_322.tmp",
    "corememo.log",
    "debugdump.txt",
    "malware_march.mp3",
    "system_flags.ini",
    "trashnote_01.txt"
  ];
  for (let f of files) {
    await printLine("- " + f);
  }
  await printLine("\n> Type your command:");
  inputField = document.createElement("input");
  terminal.appendChild(inputField);
  inputField.focus();

  inputField.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const cmd = inputField.value.trim();
      const lowerCmd = cmd.toLowerCase();
      inputField.disabled = true;

      if (lowerCmd.startsWith("cat ")) {
        const target = cmd.split(" ")[1];
        if (target.toLowerCase() === "corememo.log") {
          await printLine("...NODE INDEX REPORT...");
          await printLine("> SYS_PURGE FLAGGED");
          await printLine("> PAYLOAD CACHE LOCATED");
          await printLine("> ref: ./temp/redlist/_vault.key");
          await printLine(">> TRACE END <<");
        } else {
          await printLine("> No data found.");
        }
      } else if (lowerCmd.startsWith("extract ")) {
        const file = cmd.split(" ")[1];
        if (file === "_vault.key") {
          showRoachFlash();
          setInterval(launchFireworks, 1000);
          animateFireworks();
          await printLine("\n> EXTRACTING...");
          await printLine("> PAYLOAD CONFIRMED.");
          await printLine("> MISSION COMPLETE.");
          await printLine("> I'M IMPRESSED. WE COULD USE A HACKER LIKE YOU.");
          await printLine("> TELL D-BUG: OPERATION SWARMDIVE");
          await printLine("> D-BUG OUT.");
        } else {
          await printLine("> ACCESS DENIED. TRACE DETECTED. SYSTEM RESTORING...\n");
          setTimeout(resetToFilePhase, 1500);
        }
      } else {
        await printLine("> UNKNOWN COMMAND.");
      }

      inputField.disabled = false;
      inputField.value = "";
      inputField.focus();
    }
  });
}

runCipherPhase();
</script>
</body>
</html>
